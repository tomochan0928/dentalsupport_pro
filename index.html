<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DentalSupport Pro - チェアサイド患者説明ツール</title>
<style>
  :root {
    --bg: #eef4f8; --panel: #ffffff; --line: #d6e2ea;
    --accent: #38b0d6; --accent-dark: #2a8bab;
    --text: #2e3a44; --text-soft: #6c7c89;
    --red: #e6443a; --orange: #f59331; --yellow: #f5d623; --lesion: #d8221a; --gray: #8597a4;
    --shadow: 0 2px 10px rgba(40,90,120,.08); --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: linear-gradient(120deg,var(--accent),var(--accent-dark)); color: #fff; box-shadow: var(--shadow); }
  header .logo { font-weight: 700; font-size: 18px; }
  header .logo small { font-weight: 400; opacity: .85; font-size: 12px; margin-left: 6px; }
  header .status { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cfe9f2; }
  .dot.online { background: #7ff0a8; box-shadow: 0 0 6px #7ff0a8; }
  .dot.offline { background: #ffd36b; box-shadow: 0 0 6px #ffd36b; }

  .layout { display: grid; grid-template-columns: 290px 1fr 320px; gap: 14px; padding: 14px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent-dark); border-bottom: 2px solid var(--line); padding-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .panel h3 { font-size: 13px; margin: 14px 0 6px; color: var(--text-soft); }

  label.fld { display: block; font-size: 12px; color: var(--text-soft); margin: 8px 0 3px; }
  input[type=text], input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); background: #fbfdff; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,176,214,.15); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); transition: filter .15s, transform .05s; }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: #fff; color: var(--accent-dark); border: 1px solid var(--accent); }
  .btn.gray { background: var(--gray); }
  .btn.print { background: #4b6b7d; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  .modes { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
  .mode-btn { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: #fbfdff; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); transition: all .15s; }
  .mode-btn:hover { border-color: var(--accent); }
  .mode-btn.active { border-color: var(--accent); background: #e9f7fc; box-shadow: inset 0 0 0 1px var(--accent); }
  .swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); flex: none; }
  .swatch.o { background: var(--red); } .swatch.c { background: var(--orange); }
  .swatch.b { background: var(--yellow); } .swatch.a { background: var(--lesion); border-radius: 50%; }
  .swatch.x { background: repeating-linear-gradient(45deg,#cdd9e1,#cdd9e1 4px,#fff 4px,#fff 8px); }

  #procList { margin-top: 6px; }
  .proc-card { border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; background: #fbfdff; }
  .proc-card .pc-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; }
  .proc-card .pc-count { font-size: 11px; color: #fff; background: var(--accent); padding: 2px 8px; border-radius: 20px; }
  .proc-card ol { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--text-soft); }
  .proc-card ol li { margin: 2px 0; }
  .proc-empty { color: var(--text-soft); font-size: 12px; padding: 10px; text-align: center; }
  .total-box { margin-top: 6px; padding: 12px; border-radius: 10px; text-align: center; background: linear-gradient(120deg,var(--accent),var(--accent-dark)); color: #fff; }
  .total-box .num { font-size: 30px; font-weight: 800; line-height: 1; }
  .total-box .lbl { font-size: 11px; opacity: .9; }

  /* ===== 歯列チャート（画像＋SVGオーバーレイ） ===== */
  .chart-wrap { position: relative; width: 100%; max-width: 900px; margin: 0 auto; }
  #chartImg { display: block; width: 100%; height: auto; border-radius: 8px; }
  #chartImg.placeholder { background: repeating-linear-gradient(45deg,#f3f7fa,#f3f7fa 10px,#fff 10px,#fff 20px); border: 1px dashed #c4d2dc; aspect-ratio: 2.5 / 1; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover { fill: rgba(56,176,214,.12); }
  .mk { display: none; pointer-events: none; }
  .mk.on { display: block; }
  .mk.o { fill: var(--red); opacity: .72; }
  .mk.b { fill: var(--yellow); opacity: .6; }
  .mk.c { fill: var(--orange); opacity: .7; }
  .mk.a { fill: var(--lesion); stroke: #fff; stroke-width: 2; opacity: .9; }
  .mk.xbox { fill: rgba(120,140,155,.35); }
  .mk.xline { stroke: #5a6b78; stroke-width: 4; opacity: .8; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--text-soft); justify-content: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .settings-body { display: none; }
  .settings-body.open { display: block; }
  .set-group { border: 1px solid var(--line); border-radius: 9px; padding: 10px; margin-bottom: 10px; background: #fbfdff; }
  .set-group .sg-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 78px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit; color: var(--text); background: #fff; line-height: 1.6; }
  .hint { font-size: 11px; color: var(--text-soft); margin: 2px 0 0; }
  .small-row { display: flex; gap: 8px; align-items: center; }
  .small-row .num-fld { width: 80px; }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2e3a44; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: #c0392b; }

  /* ===== 印刷用ヘッダー（画面では非表示） ===== */
  .print-head { display: none; }

  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

  /* ================== 印刷レイアウト：治療計画説明書 ================== */
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff; }
    header, #toast { display: none !important; }
    .no-print { display: none !important; }
    .layout { display: block; padding: 0; }
    .panel { border: none; box-shadow: none; padding: 0; border-radius: 0; }
    #rightPanel { display: none !important; }
    main, #leftPanel { width: 100%; }

    .print-head { display: block; border-bottom: 2px solid var(--accent-dark); padding-bottom: 8px; margin-bottom: 12px; }
    .print-head .ph-title { font-size: 20px; font-weight: 800; color: var(--accent-dark); }
    .print-head .ph-meta { display: flex; gap: 24px; margin-top: 6px; font-size: 13px; }
    .print-head .ph-meta b { font-weight: 700; }

    main h2, #leftPanel h2 { color: #333; border-color: #999; }
    .chart-wrap { max-width: 100%; }
    .total-box { background: #2a8bab !important; }
    .proc-card .pc-count { background: #2a8bab !important; }
    .legend { margin-top: 6px; }
    /* 印刷では工程表を歯列の下にまとめる */
    .print-plan { margin-top: 14px; page-break-inside: avoid; }
    .print-foot { margin-top: 18px; font-size: 11px; color: #555; border-top: 1px dashed #aaa; padding-top: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🦷 DentalSupport&nbsp;Pro <small>チェアサイド患者説明ツール</small></div>
  <div class="status">
    <span class="dot" id="connDot"></span>
    <span id="connText">サーバー未接続</span>
  </div>
</header>

<div class="layout">

  <!-- ============ 左：コントロールパネル ============ -->
  <aside class="panel" id="leftPanel">
    <h2 class="no-print">🗂 患者・操作</h2>

    <div class="no-print">
      <label class="fld" for="clinicName">医院名（説明書に印刷）</label>
      <input type="text" id="clinicName" placeholder="例：○○歯科医院" autocomplete="off" />

      <label class="fld" for="patientId">患者番号</label>
      <input type="text" id="patientId" placeholder="例: 000123" autocomplete="off" />

      <div class="btn-row">
        <button class="btn" id="saveBtn">💾 保存</button>
        <button class="btn ghost" id="loadBtn">📥 読込</button>
      </div>
      <div class="btn-row">
        <button class="btn print" id="printBtn">🖨 印刷（患者用）</button>
        <button class="btn gray" id="clearBtn">🧹 全クリア</button>
      </div>

      <h3>操作モード</h3>
      <div class="modes" id="modeButtons">
        <button class="mode-btn active" data-mode="O"><span class="swatch o"></span>咬合面（O）</button>
        <button class="mode-btn" data-mode="C"><span class="swatch c"></span>隣接面（C）</button>
        <button class="mode-btn" data-mode="B"><span class="swatch b"></span>頬側面（B）</button>
        <button class="mode-btn" data-mode="A"><span class="swatch a"></span>根尖性歯周炎（A）</button>
        <button class="mode-btn" data-mode="X"><span class="swatch x"></span>欠損（削除）</button>
      </div>
    </div>

    <!-- 印刷用：治療計画（印刷時に歯列の下へ回り込ませるため main 内にも複製は持たず、ここを印刷で見せる） -->
    <h2 class="print-plan" style="margin-top:18px;">📋 治療工程表</h2>
    <div id="procList" class="print-plan"></div>
    <div class="total-box print-plan">
      <div class="num" id="totalVisits">0</div>
      <div class="lbl">目安 総治療回数（回）</div>
    </div>

    <div class="print-foot">
      ※ 本書は治療内容・回数の目安をご説明するものです。実際の治療は診査・診断により変更となる場合があります。
    </div>
  </aside>

  <!-- ============ 中央：歯列イラスト（添付画像＋オーバーレイ） ============ -->
  <main class="panel">
    <!-- 印刷時のみ表示されるヘッダー -->
    <div class="print-head">
      <div class="ph-title">治療計画 説明書</div>
      <div class="ph-meta">
        <span id="phClinic"></span>
        <span>患者番号：<b id="phPatient">—</b></span>
        <span>作成日：<b id="phDate"></b></span>
      </div>
    </div>

    <h2 class="no-print">🦷 歯列チャート</h2>

    <div class="chart-wrap">
      <img id="chartImg" alt="歯列表" />
      <svg id="overlay" viewBox="0 0 1000 380" preserveAspectRatio="none"></svg>
    </div>

    <div class="legend">
      <span><i style="background:var(--red)"></i>咬合面(O)</span>
      <span><i style="background:var(--orange)"></i>隣接面(C)</span>
      <span><i style="background:var(--yellow)"></i>頬側面(B)</span>
      <span><i style="background:var(--lesion);border-radius:50%"></i>根尖病巣(A)</span>
      <span><i style="background:#9fb3c0"></i>欠損</span>
    </div>
  </main>

  <!-- ============ 右：工程表カスタマイズ ============ -->
  <aside class="panel no-print" id="rightPanel">
    <h2>⚙️ 工程表カスタマイズ設定</h2>
    <button class="btn ghost" id="toggleSettings" style="width:100%;">設定を開く ▼</button>

    <div class="settings-body" id="settingsBody">
      <p class="hint">各工程は1行＝1ステップで入力。回数を変えると工程表に即時反映されます。</p>

      <div class="set-group">
        <div class="sg-title">🦷 虫歯（O / C / B）</div>
        <label class="fld">治療工程（1行1ステップ）</label>
        <textarea data-cond="caries-steps"></textarea>
        <div class="small-row" style="margin-top:6px;">
          <label class="fld" style="margin:0;">目安回数</label>
          <input type="number" min="0" class="num-fld" data-cond="caries-visits" />
        </div>
      </div>

      <div class="set-group">
        <div class="sg-title">🔴 根尖性歯周炎（A）</div>
        <label class="fld">治療工程（1行1ステップ）</label>
        <textarea data-cond="periapical-steps" style="min-height:120px;"></textarea>
        <div class="small-row" style="margin-top:6px;">
          <label class="fld" style="margin:0;">目安回数</label>
          <input type="number" min="0" class="num-fld" data-cond="periapical-visits" />
        </div>
      </div>

      <div class="set-group">
        <div class="sg-title">⬜ 欠損（補綴）</div>
        <label class="fld">治療工程（1行1ステップ）</label>
        <textarea data-cond="defect-steps"></textarea>
        <div class="small-row" style="margin-top:6px;">
          <label class="fld" style="margin:0;">目安回数</label>
          <input type="number" min="0" class="num-fld" data-cond="defect-visits" />
        </div>
      </div>

      <button class="btn" id="applySettings" style="width:100%;">設定を反映</button>
    </div>
  </aside>

</div>

<div id="toast"></div>

<script>
"use strict";
const API_BASE = "";
const DEFAULT_CHART_SRC = "tooth-chart.png"; // 同フォルダに置けば自動表示

const DEFAULT_SETTINGS = {
  caries:    { steps: ["1.う蝕除去","2.型取り","3.セット"], visits: 2, label: "虫歯（O/C/B）", color: "var(--red)" },
  periapical:{ steps: ["1.感染根管処置","2.根管貼薬(複数回)","3.根管充填","4.支台築造","5.窩洞準備・印象","6.クラウンセット"], visits: 5, label: "根尖性歯周炎（A）", color: "var(--lesion)" },
  defect:    { steps: ["1.欠損補綴カウンセリング（ブリッジ/インプラント/義歯選定）"], visits: 1, label: "欠損補綴", color: "#8597a4" }
};

let settings = structuredClone(DEFAULT_SETTINGS);
let currentMode = "O";
let toothData = {};
let chartImageData = null; // 取り込んだ歯列画像(DataURL)

const TEETH = 16; // 片顎16本
const VBW = 1000, VBH = 380; // overlay viewBox（同梱 tooth-chart.png のアスペクト 3046:1156 に一致）

/* 同梱 tooth-chart.png を画像解析して得た各歯の中心X（画像幅に対する割合）。
   別レイアウトの歯列画像に差し替える場合は、この配列と下の GEOF を調整してください。 */
const TOOTH_CX = {
  U: [0.0341,0.0923,0.1307,0.1806,0.2485,0.3119,0.3903,0.4668,0.5286,0.5867,0.6369,0.6914,0.7489,0.8185,0.8972,0.9672],
  L: [0.0420,0.1198,0.2065,0.2800,0.3355,0.3874,0.4350,0.4790,0.5217,0.5653,0.6120,0.6619,0.7150,0.7873,0.8756,0.9576]
};
/* 縦位置（画像高さに対する割合）：apex=根尖, buc=頬側中央, occ=咬合/切縁, ht/hb=歯の上端/下端 */
const GEOF = {
  U: { apex:0.030, buc:0.300, occ:0.405, ht:0.020, hb:0.430 },
  L: { apex:0.985, buc:0.730, occ:0.630, ht:0.610, hb:0.995 }
};

/* 隣接間隔から各歯の半幅（割合）を算出 */
function halfWFrac(arr, i) {
  const d = i === 0 ? arr[1]-arr[0]
          : i === arr.length-1 ? arr[i]-arr[i-1]
          : (arr[i+1]-arr[i-1])/2;
  return d * 0.46;
}

/* ================= オーバーレイ生成 ================= */
function buildOverlay() {
  const ov = document.getElementById("overlay");
  let svg = "";
  ["U","L"].forEach(arch => {
    const g = GEOF[arch];
    const cxs = TOOTH_CX[arch];
    for (let i = 0; i < cxs.length; i++) {
      const id = arch + (i + 1);
      toothData[id] = { O:false, C:false, B:false, A:false, missing:false };
      const x  = cxs[i] * VBW;
      const hw = halfWFrac(cxs, i) * VBW;
      const occY = g.occ*VBH, bucY = g.buc*VBH, apexY = g.apex*VBH;
      const hT = g.ht*VBH, hH = (g.hb-g.ht)*VBH;
      // マーク（半透明色）
      const o = `<ellipse class="mk o" data-id="${id}" cx="${x}" cy="${occY}" rx="${hw*0.6}" ry="${VBH*0.026}"/>`;
      const b = `<rect class="mk b" data-id="${id}" x="${x-hw*0.5}" y="${bucY-VBH*0.05}" width="${hw}" height="${VBH*0.10}" rx="5"/>`;
      const cL = `<rect class="mk c" data-id="${id}" x="${x-hw*1.02}" y="${bucY-VBH*0.075}" width="${hw*0.28}" height="${VBH*0.16}" rx="3"/>`;
      const cR = `<rect class="mk c" data-id="${id}" x="${x+hw*0.74}" y="${bucY-VBH*0.075}" width="${hw*0.28}" height="${VBH*0.16}" rx="3"/>`;
      const a = `<circle class="mk a" data-id="${id}" cx="${x}" cy="${apexY}" r="${VBH*0.026}"/>`;
      // 欠損（×＋ボックス）
      const xbox = `<rect class="mk xbox" data-id="${id}" x="${x-hw*0.9}" y="${hT}" width="${hw*1.8}" height="${hH}" rx="6"/>`;
      const xl1 = `<line class="mk xline" data-id="${id}" x1="${x-hw*0.7}" y1="${hT+hH*0.2}" x2="${x+hw*0.7}" y2="${hT+hH*0.8}"/>`;
      const xl2 = `<line class="mk xline" data-id="${id}" x1="${x+hw*0.7}" y1="${hT+hH*0.2}" x2="${x-hw*0.7}" y2="${hT+hH*0.8}"/>`;
      // クリック領域（最前面）
      const hit = `<rect class="hit" data-id="${id}" x="${x-hw*0.95}" y="${hT}" width="${hw*1.9}" height="${hH}"/>`;
      svg += xbox + b + cL + cR + o + a + xl1 + xl2 + hit;
    }
  });
  ov.innerHTML = svg;
  ov.querySelectorAll(".hit").forEach(el => el.addEventListener("click", () => onToothClick(el.dataset.id)));
}

/* ================= 歯クリック処理 ================= */
function onToothClick(id) {
  const d = toothData[id];
  switch (currentMode) {
    case "O": d.O = !d.O; break;
    case "C": d.C = !d.C; break;
    case "B": d.B = !d.B; break;
    case "A": d.A = !d.A; break;
    case "X": d.missing = !d.missing; break;
  }
  renderTooth(id);
  updateProcess();
}

function renderTooth(id) {
  const d = toothData[id];
  const ov = document.getElementById("overlay");
  const set = (cls, on) => ov.querySelectorAll(`.mk.${cls}[data-id="${id}"]`).forEach(e => e.classList.toggle("on", on));
  // 欠損時は他のマークを隠す
  set("o", d.O && !d.missing);
  set("b", d.B && !d.missing);
  set("c", d.C && !d.missing);
  set("a", d.A && !d.missing);
  set("xbox", d.missing);
  set("xline", d.missing);
}
function renderAllTeeth() { Object.keys(toothData).forEach(renderTooth); }

/* ================= モード切替 ================= */
document.getElementById("modeButtons").addEventListener("click", (e) => {
  const btn = e.target.closest(".mode-btn");
  if (!btn) return;
  currentMode = btn.dataset.mode;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
});

/* ================= 治療工程表 ================= */
function updateProcess() {
  let caries = 0, periapical = 0, defect = 0;
  Object.values(toothData).forEach(d => {
    if (d.missing) { defect++; return; }
    if (d.O || d.C || d.B) caries++;
    if (d.A) periapical++;
  });
  const procList = document.getElementById("procList");
  procList.innerHTML = "";
  let total = 0;
  const addCard = (cfg, count) => {
    if (count <= 0) return;
    const visits = (Number(cfg.visits) || 0) * count;
    total += visits;
    const stepsHtml = cfg.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("");
    const card = document.createElement("div");
    card.className = "proc-card";
    card.innerHTML = `
      <div class="pc-head">
        <span style="display:flex;align-items:center;gap:6px;">
          <i style="width:10px;height:10px;border-radius:3px;background:${cfg.color};display:inline-block;"></i>
          ${escapeHtml(cfg.label)} <span style="color:var(--text-soft);font-weight:400;">×${count}本</span>
        </span>
        <span class="pc-count">${visits}回</span>
      </div>
      <ol>${stepsHtml}</ol>`;
    procList.appendChild(card);
  };
  addCard(settings.caries, caries);
  addCard(settings.periapical, periapical);
  addCard(settings.defect, defect);
  if (procList.children.length === 0) procList.innerHTML = `<div class="proc-empty">歯をタップすると治療工程が表示されます。</div>`;
  document.getElementById("totalVisits").textContent = total;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= 設定パネル ================= */
const settingsBody = document.getElementById("settingsBody");
document.getElementById("toggleSettings").addEventListener("click", function(){
  const open = settingsBody.classList.toggle("open");
  this.textContent = open ? "設定を閉じる ▲" : "設定を開く ▼";
});
function fillSettingsForm(){
  document.querySelector('[data-cond="caries-steps"]').value = settings.caries.steps.join("\n");
  document.querySelector('[data-cond="caries-visits"]').value = settings.caries.visits;
  document.querySelector('[data-cond="periapical-steps"]').value = settings.periapical.steps.join("\n");
  document.querySelector('[data-cond="periapical-visits"]').value = settings.periapical.visits;
  document.querySelector('[data-cond="defect-steps"]').value = settings.defect.steps.join("\n");
  document.querySelector('[data-cond="defect-visits"]').value = settings.defect.visits;
}
function readSettingsForm(){
  const p = sel => document.querySelector(sel).value.split("\n").map(s=>s.trim()).filter(Boolean);
  settings.caries.steps     = p('[data-cond="caries-steps"]');
  settings.caries.visits    = Number(document.querySelector('[data-cond="caries-visits"]').value)||0;
  settings.periapical.steps = p('[data-cond="periapical-steps"]');
  settings.periapical.visits= Number(document.querySelector('[data-cond="periapical-visits"]').value)||0;
  settings.defect.steps     = p('[data-cond="defect-steps"]');
  settings.defect.visits    = Number(document.querySelector('[data-cond="defect-visits"]').value)||0;
}
document.getElementById("applySettings").addEventListener("click", ()=>{ readSettingsForm(); updateProcess(); toast("設定を反映しました"); });

/* ================= 歯列画像 ================= */
function setChartImage(dataUrl){
  const img = document.getElementById("chartImg");
  if (dataUrl){ img.src = dataUrl; img.classList.remove("placeholder"); chartImageData = dataUrl; }
}

/* ================= 保存・読込 ================= */
function getPatientId(){ return document.getElementById("patientId").value.trim(); }
async function saveData(){
  const patientId = getPatientId();
  if (!patientId){ toast("患者番号を入力してください", true); return; }
  readSettingsForm();
  const payload = { patientId, toothData, settings, chartImageData, clinicName: document.getElementById("clinicName").value, savedAt: new Date().toISOString() };
  try {
    const res = await fetch(`${API_BASE}/api/save`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error("HTTP "+res.status);
    setConn(true);
    localStorage.setItem("dsp_"+patientId, JSON.stringify(payload));
    toast(`サーバーに保存しました（患者 ${patientId}）`);
  } catch(err) {
    setConn(false);
    try { localStorage.setItem("dsp_"+patientId, JSON.stringify(payload)); toast("サーバー接続不可：ローカルに保存しました", true); }
    catch(e){ toast("保存に失敗（画像が大きすぎる可能性）", true); }
  }
}
async function loadData(){
  const patientId = getPatientId();
  if (!patientId){ toast("患者番号を入力してください", true); return; }
  try {
    const res = await fetch(`${API_BASE}/api/load/${encodeURIComponent(patientId)}`);
    setConn(true);
    if (res.status === 404){ resetAll(); toast(`新規患者（${patientId}）：初期状態にしました`); return; }
    if (!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if (!data || !data.toothData){ resetAll(); toast(`新規患者（${patientId}）：初期状態にしました`); return; }
    applyLoaded(data); toast(`サーバーから読込みました（患者 ${patientId}）`);
  } catch(err) {
    setConn(false);
    const backup = localStorage.getItem("dsp_"+patientId);
    if (backup){ applyLoaded(JSON.parse(backup)); toast("サーバー接続不可：ローカルから復元しました", true); }
    else { resetAll(); toast("データなし：初期状態にしました", true); }
  }
}
function applyLoaded(data){
  Object.keys(toothData).forEach(id => {
    const d = data.toothData[id];
    toothData[id] = d ? { O:!!d.O, C:!!d.C, B:!!d.B, A:!!d.A, missing:!!d.missing }
                      : { O:false, C:false, B:false, A:false, missing:false };
  });
  if (data.settings){
    ["caries","periapical","defect"].forEach(k => {
      if (data.settings[k]){
        settings[k].steps  = Array.isArray(data.settings[k].steps) ? data.settings[k].steps : settings[k].steps;
        settings[k].visits = Number(data.settings[k].visits)||0;
      }
    });
  }
  if (data.chartImageData) setChartImage(data.chartImageData);
  if (typeof data.clinicName === "string") document.getElementById("clinicName").value = data.clinicName;
  fillSettingsForm(); renderAllTeeth(); updateProcess();
}
function resetAll(){
  Object.keys(toothData).forEach(id => { toothData[id] = { O:false,C:false,B:false,A:false,missing:false }; });
  settings = structuredClone(DEFAULT_SETTINGS);
  fillSettingsForm(); renderAllTeeth(); updateProcess();
}
document.getElementById("saveBtn").addEventListener("click", saveData);
document.getElementById("loadBtn").addEventListener("click", loadData);
document.getElementById("clearBtn").addEventListener("click", ()=>{ resetAll(); toast("歯列を全クリアしました"); });

/* ================= 印刷 ================= */
document.getElementById("printBtn").addEventListener("click", ()=>{
  readSettingsForm(); updateProcess();
  document.getElementById("phClinic").textContent = document.getElementById("clinicName").value || "";
  document.getElementById("phPatient").textContent = getPatientId() || "—";
  const d = new Date();
  document.getElementById("phDate").textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  setTimeout(()=> window.print(), 60);
});

/* ================= 接続状態 / トースト ================= */
function setConn(online){
  document.getElementById("connDot").className = "dot " + (online?"online":"offline");
  document.getElementById("connText").textContent = online ? "サーバー接続中" : "オフライン（ローカル保存）";
}
let toastTimer;
function toast(msg,isErr){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show"+(isErr?" err":"");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.className=""; }, 2600);
}
async function pingServer(){ try{ const r=await fetch(`${API_BASE}/api/health`); setConn(r.ok); }catch{ setConn(false); } }

/* ================= 初期化 ================= */
function initChartImage(){
  // 同梱の tooth-chart.png を表示（無ければプレースホルダ）
  const img = document.getElementById("chartImg");
  img.onerror = () => { img.removeAttribute("src"); img.classList.add("placeholder"); };
  img.src = DEFAULT_CHART_SRC;
}
buildOverlay();
initChartImage();
fillSettingsForm();
updateProcess();
pingServer();
</script>
</body>
</html>
